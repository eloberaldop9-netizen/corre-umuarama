<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dra. Roberta Rodrigues — Cena 01 · "MAS, cuidar da autoestima também é cuidar da saúde"</title>
<style>
  @font-face{
    font-family:'Montserrat';
    src:url('assets/fonts/Montserrat-Variable.woff2') format('woff2-variations'), url('assets/fonts/Montserrat-Variable.woff2') format('woff2');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }
  :root{
    --white:#FFFFFF;
    --gelo:#F7F7F5;
    --gray-light:#E8E8E8;
    --gray-mid:#A8A8A8;
    --graphite:#2A2A2A;
    --black:#111111;
    --champagne:#D8C8B6;
    --silver:#CFCFCF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#F7F7F5;}
  #stage{
    position:relative;
    width:1080px;height:1920px;
    background:var(--gelo);
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
    transform-origin:50% 50%;
  }

  /* subtle grain texture */
  #grain{
    position:absolute;inset:0;
    opacity:.05;
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* champagne side light */
  #sidelight{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 900px 1400px at -10% 30%, rgba(216,200,182,.35), transparent 60%),
      radial-gradient(ellipse 900px 1400px at 110% 75%, rgba(216,200,182,.25), transparent 60%);
    opacity:0;
    pointer-events:none;
  }

  #vignette{
    position:absolute;inset:0;
    background: radial-gradient(ellipse 1200px 1900px at 50% 50%, transparent 55%, rgba(17,17,17,.05) 100%);
    pointer-events:none;
  }

  /* background motif layer */
  #motif{
    position:absolute;inset:0;
    pointer-events:none;
  }
  #face-contour{
    position:absolute;
    left:50%; top:1030px;
    width:520px;
    transform:translate(-50%,-50%);
    opacity:0;
    clip-path:inset(0 100% 0 0);
  }
  #face-contour img{
    width:100%; display:block;
  }

  #connector{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    pointer-events:none;
  }
  #connector path{
    fill:none;
    stroke:var(--champagne);
    stroke-width:3;
    stroke-linecap:round;
  }
  #connector circle{ fill:var(--champagne); opacity:0; }

  #sweep-line{
    position:absolute;
    left:50%; top:876px;
    width:520px; height:2px;
    background:var(--graphite);
    transform:translate(-50%,-50%) scaleX(0);
    transform-origin:0% 50%;
    opacity:0;
  }

  #underline{
    position:absolute;
    left:50%; top:1210px;
    width:520px; height:7px;
    background:linear-gradient(90deg, transparent, var(--champagne) 18%, var(--champagne) 82%, transparent);
    transform:translate(-50%,-50%) scaleX(0);
    transform-origin:0% 50%;
    opacity:0;
    box-shadow:0 3px 16px rgba(42,42,42,.14), 0 0 22px rgba(216,200,182,.7);
  }

  /* text layer */
  .txt{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    white-space:nowrap;
    opacity:0;
  }
  .cap{ text-transform:uppercase; }

  #t-mas{
    top:876px;
    font-weight:900;
    font-size:158px;
    letter-spacing:2px;
    color:var(--graphite);
  }

  #t-cuidar1{
    top:706px;
    font-weight:500;
    font-size:56px;
    letter-spacing:10px;
    color:var(--gray-mid);
  }
  #t-autoestima{
    top:876px;
    font-weight:900;
    font-size:132px;
    letter-spacing:6px;
    color:var(--black);
  }

  #t-tambem{
    top:876px;
    font-weight:700;
    font-size:92px;
    letter-spacing:6px;
    color:var(--graphite);
  }

  #t-cuidar2{
    top:706px;
    font-weight:500;
    font-size:56px;
    letter-spacing:10px;
    color:var(--gray-mid);
  }
  #t-saude{
    top:920px;
    font-weight:900;
    font-size:190px;
    letter-spacing:6px;
    color:var(--black);
  }

  /* recap block */
  #recap{
    position:absolute;
    left:50%; top:900px;
    transform:translate(-50%,-50%);
    text-align:center;
    opacity:0;
    width:960px;
  }
  #recap .line{
    white-space:nowrap;
    font-size:50px;
    font-weight:900;
    letter-spacing:.5px;
    color:var(--black);
    line-height:1.42;
  }
  #recap .line .soft{
    font-weight:500;
    letter-spacing:6px;
    color:var(--gray-mid);
  }
  #recap .line .mid{
    font-weight:700;
    color:var(--graphite);
  }

  #logo{
    position:absolute;
    left:50%; top:1330px;
    transform:translate(-50%,-50%);
    width:260px;
    opacity:0;
  }
  #logo img{ width:100%; display:block; }

  #glow{
    position:absolute;
    left:50%; top:960px;
    width:900px; height:900px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(207,207,207,.35) 55%, transparent 75%);
    opacity:0;
    pointer-events:none;
  }

  #recap-rule{
    position:absolute;
    left:50%; top:1005px;
    width:420px; height:6px;
    background:linear-gradient(90deg, transparent, var(--champagne) 18%, var(--champagne) 82%, transparent);
    transform:translate(-50%,-50%) scaleX(0);
    transform-origin:0% 50%;
    opacity:0;
    box-shadow:0 2px 12px rgba(42,42,42,.12), 0 0 18px rgba(216,200,182,.6);
  }

</style>
</head>
<body>
<div id="stage">
  <img id="grain" src="assets/grain.png" alt="" />
  <div id="sidelight"></div>

  <div id="motif">
    <div id="face-contour"><img src="assets/icon.png" alt="" /></div>
  </div>

  <div id="sweep-line"></div>

  <svg id="connector" viewBox="0 0 1080 1920">
    <path id="connector-path" d="M 660 900 C 780 900 820 900 900 900"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <circle id="connector-dot1" cx="760" cy="900" r="5"/>
    <circle id="connector-dot2" cx="860" cy="900" r="5"/>
  </svg>

  <div id="underline"></div>
  <div id="glow"></div>

  <div id="t-mas" class="txt cap">MAS,</div>

  <div id="t-cuidar1" class="txt cap">CUIDAR DA</div>
  <div id="t-autoestima" class="txt cap">AUTOESTIMA</div>

  <div id="t-tambem" class="txt cap">TAMBÉM É</div>

  <div id="t-cuidar2" class="txt cap">CUIDAR DA</div>
  <div id="t-saude" class="txt cap">SAÚDE</div>

  <div id="recap">
    <div class="line"><span class="soft">CUIDAR DA</span> AUTOESTIMA</div>
    <div class="line"><span class="mid">TAMBÉM É</span> <span class="soft">CUIDAR DA</span> SAÚDE</div>
  </div>
  <div id="recap-rule"></div>

  <div id="logo"><img src="assets/logo.png" alt="Dra. Roberta Rodrigues" /></div>

  <div id="vignette"></div>
</div>

<script src="timeline.js"></script>
</body>
</html>
